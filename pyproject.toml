[project]
name = "soma-artifact"
version = "0.1.0"
description = "SOMA: transactional migration of live Python sessions across heterogeneous runtimes (research artifact)"
readme = "README.md"
requires-python = ">=3.11"
# Pinned to the versions the results and tests were verified with (Python 3.11).
# Newer torch releases fail 9 tests with a PicklingError on typing_extensions.sentinel.
dependencies = [
    "numpy==2.4.6",
    "dill==0.4.1",
]

[project.optional-dependencies]
# torchvision provides the ResNet-18 fixture used by E13 and E14.
torch = ["torch==2.8.0", "torchvision==0.23.0"]
figures = ["matplotlib==3.11.2", "pillow==12.3.0"]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Install editable only (`pip install -e .`): the controller reads
# experiments/*.py relative to the repository root at import time.
[tool.hatch.build.targets.wheel]
packages = ["src/handoff", "src/capsule", "src/clusy_boundary"]
only-include = ["src/handoff", "src/capsule", "src/clusy_boundary", "src/runmeta.py"]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"
